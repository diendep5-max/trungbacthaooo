<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Trứng Bắc Thảo</title>
    <!-- Import font chữ đáng yêu -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Mali', cursive; /* Sử dụng font chữ đáng yêu mới */
            background-color: #f4fce8;
            color: #3b4d2e;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Ảnh bìa */
        .cover-image {
            width: 250px;
            border-radius: 20px;
            border: 5px solid #ffb3c6;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
            margin: 20px auto;
            display: block;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            color: #4a633a;
            text-shadow: 2px 2px 4px #d3e8c1;
        }

        /* Sticker trang trí nhảy múa 2 bên */
        .jumping-sticker {
            position: fixed;
            width: 100px;
            z-index: -1;
            border-radius: 50%;
            animation: jumpAround 2s infinite alternate ease-in-out;
        }

        .sticker-left {
            left: 5%;
            top: 30%;
            animation-delay: 0s;
        }

        .sticker-right {
            right: 5%;
            top: 40%;
            animation-delay: 0.5s; /* Lệch nhịp cho tự nhiên */
        }

        @keyframes jumpAround {
            0% { transform: translateY(0) rotate(-10deg) scale(1); }
            50% { transform: translateY(-30px) rotate(10deg) scale(1.1); }
            100% { transform: translateY(0) rotate(-10deg) scale(1); }
        }

        /* Container chứa các nút */
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        button {
            background-color: #8db56b;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-family: inherit;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            font-weight: 600;
        }

        button:hover {
            background-color: #79a159;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(1px);
        }

        #next-btn {
            background-color: #ffb3c6; /* Màu hồng cho nút next */
            color: #d1567d;
            display: none; /* Ẩn đi lúc đầu */
            margin: 15px auto;
            font-size: 1.3rem;
            padding: 10px 40px;
        }

        #next-btn:hover {
            background-color: #ff9fb6;
        }

        #result-area {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease-in-out;
            z-index: 10;
            position: relative;
            min-height: 350px;
        }

        #result-text {
            font-size: 1.8rem;
            color: #d1567d;
            margin-bottom: 20px;
            font-weight: 700;
        }

        #result-img {
            width: 300px;
            max-width: 90%;
            border-radius: 20px;
            border: 5px solid #ffb3c6;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            animation: bounceIn 0.8s;
            display: none; /* Ẩn đi lúc đầu */
        }

        /* Heart Animation */
        .heart {
            position: fixed;
            font-size: 2rem;
            color: #ff4d6d;
            animation: flyUp 3s ease-in forwards;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Sticker nhảy múa 2 bên -->
    <img src="download (4).jpg" class="jumping-sticker sticker-left" alt="Sticker vui nhộn">
    <img src="download (6).jpg" class="jumping-sticker sticker-right" alt="Sticker chạy nhảy">

    <!-- Ảnh bìa -->
    <img src="download (2).jpg" class="cover-image" alt="Ảnh bìa trứng bắc thảo cute">

    <h1>Xin chào, chào mừng tới với thế giới trứng bắc thảo!</h1>

    <div class="button-container">
        <button onclick="showResult('tui-la-ai')">tui là ai?</button>
        <button onclick="showResult('ban-la-gi')">bạn là gì của tui?</button>
        <button onclick="showResult('tai-sao')">tại sao lại có cái web này?</button>
    </div>

    <div id="result-area">
        <h2 id="result-text"></h2>
        <button id="next-btn" onclick="showNext()">Next ➔</button>
        <img id="result-img" src="" alt="Kết quả">
    </div>

    <script>
        function createHearts() {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '💖';
                    heart.classList.add('heart');
                    
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = window.innerHeight + 'px';
                    
                    const size = Math.random() * 2 + 1;
                    heart.style.fontSize = size + 'rem';
                    
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 3000);
                }, i * 100); 
            }
        }

        function showResult(type) {
            const resultArea = document.getElementById('result-area');
            const resultText = document.getElementById('result-text');
            const resultImg = document.getElementById('result-img');
            const nextBtn = document.getElementById('next-btn');

            // Reset trạng thái
            resultArea.style.display = 'flex';
            resultImg.style.animation = 'none';
            resultImg.offsetHeight; /* trigger reflow */
            resultImg.style.animation = 'bounceIn 0.8s';
            
            if (type === 'tui-la-ai') {
                resultText.innerText = 'ngừi bạn đáng iu nhất thế giới';
                resultImg.src = '591871576072367109.jpg';
                resultImg.style.display = 'block';
                nextBtn.style.display = 'none';
                createHearts();
            } else if (type === 'ban-la-gi') {
                resultText.innerText = 'ngừi bạn iu iu cụa tui, cảm ơn bạn zì đã tới với thế zới này';
                resultImg.src = '891290582524068607.jpg';
                resultImg.style.display = 'block';
                nextBtn.style.display = 'none';
                createHearts();
            } else if (type === 'tai-sao') {
                resultText.innerText = 'vì tui mún cảm ơn bạn và....';
                resultImg.style.display = 'none'; // Ẩn ảnh đi để hiện nút Next
                nextBtn.style.display = 'block';
            }
        }

        function showNext() {
            const resultText = document.getElementById('result-text');
            const resultImg = document.getElementById('result-img');
            const nextBtn = document.getElementById('next-btn');
            
            // Xử lý khi ấn nút Next
            resultText.innerText = 'hong nói hihi';
            resultImg.src = 'download (1).jpg'; // Ảnh suỵt
            resultImg.style.display = 'block';
            nextBtn.style.display = 'none'; // Ẩn nút Next đi
            
            // Chạy lại animation cho ảnh
            resultImg.style.animation = 'none';
            resultImg.offsetHeight;
            resultImg.style.animation = 'bounceIn 0.8s';
            
            createHearts();
        }
    </script>

</body>
</html>
